{% extends 'users/Userbase.html' %}
{% block content %}
<style>
    .summarization-container {
        background: linear-gradient(to right, #1e293b, #0f172a);
        padding: 2rem;
        margin-top: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
        color: #e2e8f0;
        animation: fadeIn 0.6s ease-in-out;
    }

    .summarization-container h3 {
        color: #38bdf8;
        font-size: 1.8rem;
        margin-bottom: 1rem;
        font-weight: 700;
        text-align: center;
    }

    .form-label {
        color: #cbd5e1;
        font-weight: 600;
        font-size: 1.05rem;
    }

    textarea.form-control {
        width: 100%;
        min-height: 300px; /* Increased height */
        font-size: 1rem;
        padding: 1rem;
        border-radius: 8px;
        border: 1px solid #3b82f6;
        background-color: #0f172a;
        color: #f1f5f9;
        resize: vertical;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    textarea.form-control:focus {
        border-color: #38bdf8;
        outline: none;
        box-shadow: 0 0 10px #38bdf8;
    }

    .btn-success {
        background: linear-gradient(to right, #38bdf8, #3b82f6);
        border: none;
        padding: 0.7rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 6px;
        transition: all 0.3s ease;
        box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4);
        display: block;
        margin: 1.5rem auto;
    }

    .btn-success:hover {
        background: linear-gradient(to right, #3b82f6, #1e40af);
        transform: translateY(-2px);
    }

    .alert {
        font-size: 1rem;
        padding: 1rem;
        border-radius: 8px;
        margin-top: 1rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="summarization-container">
    <h3>📄 Financial Report Summarization</h3>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="report_text" class="form-label">Paste Financial Report (10-K Section)</label>
            <textarea name="report_text" id="report_text" rows="15" class="form-control">{{ request.POST.report_text }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">🔎 Summarize</button>
    </form>

    {% if summary %}
        <div class="mt-4">
            <h5>📌 AI-Generated Summary:</h5>
            <div class="alert alert-info">{{ summary }}</div>
        </div>
    {% endif %}

    {% if raw_response and not summary %}
        <div class="alert alert-warning">{{ raw_response }}</div>
    {% endif %}
</div>
{% endblock %}
